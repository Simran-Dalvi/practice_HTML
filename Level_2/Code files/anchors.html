<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor tag</title>
</head>
<body>
    <a href="https://github.com/Complete-Coding/HTML_Complete_Youtube">Website I am learning from</a> <br>
    <a href="https://www.google.com/" target="_blank">Google</a> <br>
    <!-- _blank: Load the URL into a new browsing context. 
        This is usually a tab, but users can 
        configure browsers to use new windows instead. -->
    <a href="https://play.google.com/">Play Store</a>
</body>
</html>
